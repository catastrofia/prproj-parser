[build-system]
requires = ["setuptools>=68.0", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prproj-parser"
dynamic = ["version"]
description = "Efficient parser for Adobe Premiere Pro .prproj project files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
fast = ["lxml>=4.9"]
secure = ["defusedxml>=0.7"]
all = ["lxml>=4.9", "defusedxml>=0.7"]
dev = [
    "build>=1.0",
    "mypy>=1.8,<1.18",
    "pre-commit>=3.5",
    "pytest>=7.4",
    "ruff==0.6.9",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/catastrofia/prproj-parser"
Issues = "https://github.com/catastrofia/prproj-parser/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/prproj_parser/_version.py"

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["README.md", "prproj-structure.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Benchmarks embed long XML template lines; wrapping them hurts readability.
"benchmarks/*" = ["E501"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
files = ["src/prproj_parser"]
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
disallow_untyped_defs = false
